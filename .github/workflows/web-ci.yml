name: Web CI

on:
  push:
    branches: [ main, ms-pty ]
    paths:
      - 'web/**'
      - 'native/vt-fwd/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'native/vt-fwd/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.97.0

defaults:
  run:
    working-directory: web

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          host_target="$(rustc +"$RUST_TOOLCHAIN" -vV | sed -n 's/^host: //p')"
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$host_target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Build node-pty for TypeScript
        run: |
          cd node-pty
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Run type checking
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

  build:
    name: Build
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          host_target="$(rustc +"$RUST_TOOLCHAIN" -vV | sed -n 's/^host: //p')"
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$host_target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build node-pty
        run: |
          cd node-pty
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Build project
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-build
          path: |
            web/dist/
            web/public/
          retention-days: 7

  test:
    name: Test
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update \
            --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          host_target="$(rustc +"$RUST_TOOLCHAIN" -vV | sed -n 's/^host: //p')"
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$host_target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cd ../native/vt-fwd && cargo fmt --all -- --check

      - name: Lint Rust forwarder
        run: cd ../native/vt-fwd && cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test Rust forwarder
        run: cd ../native/vt-fwd && cargo test --all-targets --all-features --locked

      - name: Build Rust forwarder
        env:
          VIBETUNNEL_VERSION: ci
        run: cd ../native/vt-fwd && cargo build --release --locked

      - name: Run Rust forwarder E2E tests
        run: python3 ../native/vt-fwd/test/e2e.py ../native/vt-fwd/target/release/vibetunnel-fwd

      - name: Install Rust forwarder
        run: node scripts/build-fwd-rust.js

      - name: Run client tests
        run: pnpm run test:client:coverage

      - name: Run server tests
        run: pnpm run test:server:coverage

      - name: Upload client coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: client-coverage-report
          path: web/coverage/client/
          retention-days: 7

      - name: Upload server coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: server-coverage-report
          path: web/coverage/server/
          retention-days: 7

  npm-build:
    name: Linux npm build (no pnpm)
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Linux bootstrap (Node + Rust + deps)
        run: scripts/linux-bootstrap.sh

      - name: Install dependencies (npm)
        run: npm install --legacy-peer-deps

      - name: Build project (npm)
        run: npm run build
