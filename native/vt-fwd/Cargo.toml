[package]
name = "vibetunnel-fwd"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = { version = "0.4.4", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
